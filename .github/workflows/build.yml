# Every push and pull request: compile, unit tests, and the core on Paper, end to end.
# The other platforms run in platforms.yml: monthly, and by hand before a release.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runner is thrown away after the job: no need for Testcontainers' reaper, whose image
  # would come from Docker Hub and its anonymous pull limit.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build and unit tests
        run: ./gradlew build
      - name: Paper, end to end
        run: ./gradlew :vania-metrics-testkit:integrationTest -Pvania.it.platforms=paper
      - name: Summary
        if: always()
        run: cat testkit/build/vania-it/results-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs
          path: testkit/build/vania-it/
          retention-days: 5

  # Records the result on the organization's status page (Vania-Metrics/.github, status branch).
  status:
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
    uses: Vania-Metrics/.github/.github/workflows/status.yml@main
    with:
      result: ${{ needs.build.result }}
    secrets:
      STATUS_DEPLOY_KEY: ${{ secrets.VANIA_STATUS_DEPLOY_KEY }}
