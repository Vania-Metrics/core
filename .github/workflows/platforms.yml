# The core on every platform of compatibility.yml, one after the other on a single runner.
# Monthly, to notice when something outside the code moved (a download that disappeared, an
# image), and by hand before tagging a release.
name: platforms

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms, empty for all'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  platforms:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # Downloaded and built server jars. Saved from main only: a cache saved by another ref is
      # not visible to main, and would only use up the repository's quota.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vania-metrics
          key: vania-it-${{ hashFiles('testkit/src/main/java/**/Variant.java') }}
          restore-keys: vania-it-
      - name: Every platform
        run: >
          ./gradlew --continue
          :vania-metrics-testkit:integrationTest :vania-metrics-testkit:integrationTestUntested
          "-Pvania.it.platforms=${{ inputs.platforms }}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/vania-metrics
          key: vania-it-${{ hashFiles('testkit/src/main/java/**/Variant.java') }}
      - name: Summary
        if: always()
        run: cat testkit/build/vania-it/results-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs
          path: testkit/build/vania-it/
          retention-days: 5
