# VaniaMetrics configuration
#
# Written once, on first start, and never touched again: this file is yours.
# Every key can be overridden by an environment variable, upper-cased, dots
# turned into underscores, prefixed with VANIA_METRICS_:
#
#     http.port  ->  VANIA_METRICS_HTTP_PORT
#
# This lets a Helm chart or a compose file set everything without shipping a
# file, the same way Plan and LuckPerms do.

# --- Scrape endpoint ---------------------------------------------------------
# 0.0.0.0 rather than 127.0.0.1: Prometheus usually scrapes from another host or
# pod. Restrict access with a firewall or a NetworkPolicy, not the bind address.
http.bind = 0.0.0.0
http.port = 9940
http.path = /metrics
# Bearer token required when non-empty. Empty by default: on a closed network
# one more secret to rotate adds nothing.
http.token =

# --- Core collectors ---------------------------------------------------------
# All enabled by default. Disable one with collector.<name> = false; set a
# background collector's interval, in seconds, with collector.<name>.interval.
collector.jvm = true
collector.cgroup = true
collector.disk = true
collector.disk.interval = 300
collector.disk.paths = /data,/backups,/server
collector.tick = true
collector.world = true
# 10 s rather than 15: with a 5 s scrape interval, a value that only moves every
# 15 s draws a staircase. Not lowered to 5 s because the per-entity-type
# breakdown is O(n), the only expensive part of this collector; the rest reads
# O(1) server counters.
collector.world.interval = 10
# Entity types below this count are not published: a hundred types across three
# worlds would be three hundred time series counting zeros.
# Set to -1 to publish nothing per type.
collector.world.entity_type_threshold = 5
collector.players = true
collector.events = true

# --- Per-player detail -------------------------------------------------------
# A "player" label creates one series per player. "Never do it" is right at a
# thousand players and wrong for a server of a few dozen: fifty slots make a few
# hundred series, next to the ~300 the server already publishes.
#
# Two guarantees keep it bounded:
#   - only online players are published. Nothing is lost: finding a head,
#     earning money and dying all happen online, so a series that lives for the
#     session captures everything the player does, and Prometheus keeps its
#     history after they leave;
#   - a hard cap. Beyond it, detail stops and mc_exporter_player_series_dropped
#     says so; announced degradation beats a Prometheus that grows silently.
#
# Still forbidden: per-player labels on high-frequency metrics such as packets
# or broken blocks. This publishes states, not flows.
collector.players.per_player = true
collector.players.max_series = 200
collector.proxy = true
collector.proxy.ping_timeout = 5

# --- Collector plugins -------------------------------------------------------
# Each integration is a separate jar: removing it from the plugins folder is the
# switch, and a more honest one than a key, since nothing loads, runs or fails.
#
# What remains configurable is the collector each plugin registers, through the
# same keys as the others: collector.<name> and collector.<name>.interval.
collector.spark = true
collector.luckperms = true
collector.luckperms.interval = 300
collector.essentials = true
collector.essentials.interval = 60
collector.multiverse = true

# The packets collector is active as soon as its jar is installed, but its type
# list is empty by default: one total counter instead of two hundred series.
# Each type listed here adds two time series.
collector.packets = true
collector.packets.types =

# Quests and economy are event-driven: they listen to BetonQuest and
# ExcellentEconomy instead of querying MySQL. The exporter never touches the
# database: no connection, no schema to track, no TPS depending on the health
# of an SQL server.
#
# The trade-off: counters restart from zero on reboot. "How many ever" can no
# longer be answered; "how many this week" can.
collector.betonquest = true
collector.economy = true

# --- Plugin connectors -------------------------------------------------------
# The missing jar is the switch. These keys silence a collector whose jar is
# installed, to rule out a suspect without redeploying.
collector.anticheat = true
collector.mob = true
collector.region = true
collector.region.interval = 60
collector.pregen = true
collector.portal = true
collector.inventory = true
collector.nova = true
collector.nova.interval = 30

# The connector of last resort. It exposes any placeholder as a metric, which
# covers every plugin that will never get a collector of its own.
#
# Empty by default on purpose: exposing "all placeholders" makes no sense, there
# are hundreds and most return text. Three safeguards:
#   - this allowlist;
#   - only values that parse as a number are published; the rest is logged once
#     and ignored;
#   - resolved without a player, so no per-player series.
#
# The metric name derives from the placeholder:
#   %plan_players_online_total%  ->  mc_placeholder_plan_players_online_total
collector.placeholder = true
collector.placeholder.interval = 30
collector.placeholder.list =
