# =============================================================================
# VaniaMetrics — configuration
# =============================================================================
# ÉCRIT UNE SEULE FOIS, au premier démarrage, puis jamais retouché : ce fichier
# est à vous. Toute clé se surcharge par l'environnement, en majuscules avec des
# soulignés et le préfixe VANIA_METRICS_ :
#
#     http.port  ->  VANIA_METRICS_HTTP_PORT
#
# C'est ce qui permet au chart de tout décider depuis values.yaml sans livrer de
# fichier — même mécanique que Plan et LuckPerms dans ce dépôt.

# --- Le point de collecte ----------------------------------------------------
# 0.0.0.0 et non 127.0.0.1 : Prometheus interroge depuis un autre pod. Ce qui
# protège le port est la NetworkPolicy du namespace, pas l'interface d'écoute.
http.bind = 0.0.0.0
http.port = 9940
http.path = /metrics
# Jeton « Bearer » exigé si non vide. Vide par défaut : dans un namespace clos,
# un secret de plus à faire tourner n'apporte rien.
http.token =

# --- Les collecteurs du noyau ------------------------------------------------
# Tous actifs par défaut. Chacun se coupe par collector.<nom> = false, et un
# collecteur de fond se règle par collector.<nom>.interval, en secondes.
collector.jvm = true
collector.cgroup = true
collector.disk = true
collector.disk.interval = 300
collector.disk.paths = /data,/backups,/server
collector.tick = true
collector.world = true
# 10 s et non 15 : Prometheus relève le jeu toutes les 5 s, et une valeur qui ne
# bouge que toutes les 15 s dessine un escalier. Ce n'est pas descendu à 5 s
# parce que le détail par TYPE d'entité est en O(n) — c'est la seule partie
# coûteuse de ce collecteur, le reste étant des compteurs O(1) du serveur.
collector.world.interval = 10
# Les types d'entités sous ce seuil ne sont pas publiés : cent types sur trois
# mondes feraient trois cents séries temporelles pour compter des zéros.
# Mettre -1 pour ne rien publier par type.
collector.world.entity_type_threshold = 5
collector.players = true
collector.events = true

# --- Le détail par joueur ----------------------------------------------------
# UNE ÉTIQUETTE « player » CRÉE UNE SÉRIE PAR JOUEUR. La règle « jamais » est
# juste à l'échelle de mille joueurs et fausse à celle d'un serveur de quelques
# dizaines : cinquante places font quelques centaines de séries, à comparer aux
# près de trois cents que le serveur publie déjà.
#
# Deux garanties tiennent la promesse :
#   - seuls les joueurs CONNECTÉS sont publiés. Ce n'est pas une perte : on ne
#     trouve un crâne, ne gagne de l'argent et ne meurt qu'en ligne. Une série
#     qui vit le temps de la session capture donc TOUT ce que le joueur fait, et
#     Prometheus en garde l'historique après son départ ;
#   - un plafond dur. Au-delà, le détail cesse et mc_exporter_player_series_dropped
#     le dit — une dégradation annoncée vaut mieux qu'un Prometheus qui gonfle en
#     silence.
#
# Ce qui reste interdit sans exception : étiqueter par joueur une métrique à
# haute fréquence — un paquet, un bloc cassé. Ici on publie des ÉTATS.
collector.players.per_player = true
collector.players.max_series = 200
collector.proxy = true
collector.proxy.ping_timeout = 5

# --- Les modules -------------------------------------------------------------
# IL N'Y A PLUS DE « module.<nom> = true/false » ICI, et c'est le changement
# apporté par la version 0.2 : chaque intégration est un JAR À PART. Le retirer du
# répertoire des plugins EST l'interrupteur, et il est plus franc qu'une clé —
# rien ne se charge, rien ne tourne, rien ne peut planter.
#
# Ce qui reste réglable est le COLLECTEUR que chaque module enregistre, par les
# mêmes clés que les autres : collector.<nom> et collector.<nom>.interval.
collector.spark = true
collector.luckperms = true
collector.luckperms.interval = 300
collector.essentials = true
collector.essentials.interval = 60
collector.multiverse = true

# Le collecteur de paquets est actif dès que son jar est là — mais sa liste de
# types reste vide par défaut : un seul compteur total, et pas deux cents séries.
# Chaque type ajouté ici fait deux séries temporelles.
collector.packets = true
collector.packets.types =

# Les quêtes et l'économie sont ÉVÉNEMENTIELLES : elles écoutent BetonQuest et
# ExcellentEconomy au lieu d'interroger MySQL. L'exportateur ne touche donc
# jamais à la base — ni connexion, ni schéma à suivre, ni TPS qui dépende de la
# santé d'un serveur SQL.
#
# Le prix : un compteur repart de zéro au redémarrage. « Combien depuis
# toujours » n'est plus une question qu'on sait poser ; « combien cette
# semaine », si.
collector.betonquest = true
collector.economy = true

# --- Les connecteurs de plugins ----------------------------------------------
# Rappel : le jar absent EST l'interrupteur. Ces clés servent à TAIRE un module
# dont le jar est là — pour isoler un soupçon sans redéployer.
collector.anticheat = true
collector.mob = true
collector.region = true
collector.region.interval = 60
collector.pregen = true
collector.portal = true
collector.inventory = true
collector.nova = true
collector.nova.interval = 30

# LE CONNECTEUR DE DERNIER RECOURS. Il expose n'importe quel placeholder comme
# métrique, et couvre donc tous les plugins qui n'auront jamais de module à eux.
#
# VIDE PAR DÉFAUT, et ce n'est pas une omission : exposer « tous les
# placeholders » n'aurait pas de sens — il y en a des centaines et la plupart
# rendent du texte. Trois gardes tiennent ce module :
#   - cette liste blanche ;
#   - seul ce qui se convertit en NOMBRE est publié, le reste est signalé une
#     fois puis ignoré ;
#   - résolution SANS joueur, donc aucune série par joueur.
#
# Le nom se déduit du placeholder :
#   %plan_players_online_total%  ->  mc_placeholder_plan_players_online_total
collector.placeholder = true
collector.placeholder.interval = 30
collector.placeholder.list =
