# The core. It knows no third-party plugin: each integration is a separate jar
# that declares "depend: [VaniaMetrics]" and registers through the API, so
# Bukkit loads the core first. No softdepend is needed here.
name: VaniaMetrics
version: ${version}
main: fr.samflix.vaniametrics.paper.PaperPlugin
api-version: '1.21'
authors: [mc-vania]
description: Exposes server metrics in the Prometheus format.
