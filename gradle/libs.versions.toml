# Compile-time dependencies only: none of them end up in the produced jars,
# which contain only our own API and common core.
#
# SHA-256 checksums of everything resolved are pinned in
# gradle/verification-metadata.xml. After a version bump:
#   ./gradlew --write-verification-metadata sha256 build
#
# paper-api is a timestamped snapshot. Paper does not publish release versions
# of its API: the timestamp is the version. To pick a newer one, read
# maven-metadata.xml in the 1.21.11-R0.1-SNAPSHOT directory. The checksum was
# checked against the jar the server actually loads.
#
# paper-api is resolved as a fixed version (see settings.gradle.kts), so without
# its transitive dependencies: the "paper" bundle declares the ones compilation
# needs. Their versions follow paper-api's .pom.
#
# velocity-api is also an annotation processor: it generates
# velocity-plugin.json from @Plugin, so there is no second source of truth.
[versions]
paper-api = "1.21.11-R0.1-20260511.115010-91"
velocity-api = "3.5.1"
sponge-api = "17.0.0"
bungeecord-api = "1.21-R0.3"
adventure = "4.26.1"
# Tests only: nothing below ends up in a plugin jar.
junit = "6.1.3"
testcontainers = "2.0.5"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
geyser-api = { module = "org.geysermc.geyser:api", version = "2.11.2-20260910.131131-9" }
# The Geyser API jar is read without its metadata (see settings.gradle.kts): its dependencies are listed here.
geyser-base-api = { module = "org.geysermc.api:base-api", version = "1.0.3" }
# base-api pulls this as a floating 1.1-SNAPSHOT; pinned here, and excluded from base-api.
geyser-events = { module = "org.geysermc.event:events", version = "1.1-20230815.153219-4" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeecord-api" }
sponge-api = { module = "org.spongepowered:spongeapi", version.ref = "sponge-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }
examination-api = { module = "net.kyori:examination-api", version = "1.3.0" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.0" }
checker-qual = { module = "org.checkerframework:checker-qual", version = "3.49.2" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "24.1.0" }
guava = { module = "com.google.guava:guava", version = "33.3.1-jre" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
snakeyaml = { module = "org.yaml:snakeyaml", version = "2.7" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version = "2.0.20" }

[bundles]
paper = ["paper-api", "adventure-api", "adventure-key", "examination-api", "jspecify", "checker-qual", "jetbrains-annotations", "guava"]
